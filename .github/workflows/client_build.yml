name: client_build

"on":
  # 匹配 v 开头的 Tag 推送触发
  push:
    tags:
      - v*
  # 允许在 Actions 手动触发
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_app
          - os: windows-latest
            target: windows_app
          - os: windows-latest
            target: windows_standalone

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt
            **/client/data/requirements*.txt

      - name: Install Dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
              pip install -r ./client/data/requirements_for_posix.txt
          elif [ "$RUNNER_OS" == "Windows" ]; then
              pip install -r ./client/data/requirements_for_windows.txt
          else
              echo "$RUNNER_OS not supported"
              exit 1
          fi
        shell: bash

      - name: Generate Build Version
        id: build_version
        run: |
          # 生成符合 Windows 规范的四段式编译日期版本号，格式例如: 2026.10.22.0
          BUILD_DATE=$(date -u +'%Y.%m.%d.0')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Generated build version date: $BUILD_DATE"
        shell: bash
        
      - name: Build with Nuitka (Linux)
        if: matrix.target == 'linux_app'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          working-directory: ./client
          script-name: usb_kvm_client.py
          mode: app
          python-flag: |
            -u
            -O
          include-data-dir: |
            ./data=data
            ./icons=icons
            ./translations=translations
          enable-plugins: pyside6
          include-qt-plugins: multimedia
          quiet: true

      - name: Build with Nuitka (Windows App)
        if: matrix.target == 'windows_app'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          working-directory: ./client
          script-name: usb_kvm_client.py
          mode: app
          python-flag: |
            -u
            -O
          include-data-dir: |
            ./data=data
            ./icons=icons
            ./translations=translations
          enable-plugins: pyside6
          include-qt-plugins: multimedia
          product-name: usb kvm client
          product-version: ${{ steps.build_version.outputs.BUILD_DATE }}
          file-description: open source usb kvm client
          windows-console-mode: disable
          windows-icon-from-ico: ./icons/main.ico
          onefile-windows-splash-screen-image: ./icons/splash.png
          quiet: true

      - name: Build with Nuitka (Windows Standalone)
        if: matrix.target == 'windows_standalone'
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          working-directory: ./client
          script-name: usb_kvm_client.py
          mode: standalone
          python-flag: |
            -u
            -O
          include-data-dir: |
            ./data=data
            ./icons=icons
            ./translations=translations
          enable-plugins: pyside6
          include-qt-plugins: multimedia
          product-name: usb kvm client
          product-version: ${{ steps.build_version.outputs.BUILD_DATE }}
          file-description: open source usb kvm client
          windows-console-mode: disable
          windows-icon-from-ico: ./icons/main.ico
          quiet: true
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}_build
          path: |
            ./client/build/*.exe
            ./client/build/*.bin
            ./client/build/**/*.app/**
            ./client/build/**/*.dist/**
          include-hidden-files: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./download-artifact
          
      - name: Display structure of downloaded files
        run: ls -R ./download-artifact

      - name: Compress to zip file
        run: |
          # 压缩 Linux 产物
          zip ./download-artifact/usb_kvm_client_for_linux.zip ./download-artifact/linux_app_build/*.bin -v -1 -j
          
          # 压缩 Windows 单文件产物
          zip ./download-artifact/usb_kvm_client_for_windows_app.zip ./download-artifact/windows_app_build/*.exe -v -1 -j
          
          # 压缩 Windows 标准文件夹产物（保留目录结构）
          cd ./download-artifact/windows_standalone_build/usb_kvm_client.dist
          zip -r ../../../download-artifact/usb_kvm_client_for_windows_standalone.zip ./*
          cd -

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./download-artifact/*.zip
          tag_name: ${{ github.ref_name }}
          body: "Release of ${{ github.ref_name }} (Includes Linux, Windows Onefile, and Windows Standalone versions with build date versioning)."
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}